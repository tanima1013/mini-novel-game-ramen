<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ラーメンを食べるか否か</title></head>
<body style="margin:0;background:#111;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box">
<div id="novel-game">
    <div id="game-screen">
        <!-- 背景 -->
        <img
            id="background-image"
            alt=""
        >
        <!-- タイトル画面 -->
        <div id="title-screen">
            <div id="game-title">
                ラーメンを食べるか否か
            </div>
            <button id="game-start-button">
                GAME START
            </button>
        </div>
        <!-- テキスト画面 -->
        <div id="text-panel">
            <div id="character-name">
            </div>
            <div id="novel-text">
            </div>
            <div id="choice-area">
            </div>
            <button id="next-button">
                ▼
            </button>
        </div>
    </div>
</div>
<style>
全体 ============================================================ */ #novel-game { width: 100%; display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
ゲーム画面 ============================================================ */ #game-screen { position: relative; width: 700px; max-width: 100%; height: min(800px, calc(100dvh - 24px)); overflow: hidden; background: #222222; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
背景画像 ★ 修正部分 高さ550px object-fit: contain ============================================================ */ #background-image { position: absolute; top: 0; left: 0; width: 100%; height: 550px; object-fit: contain; background: #222222; display: none; }
タイトル ============================================================ */ #title-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient( rgba(20, 20, 20, 0.5), rgba(0, 0, 0, 0.9) ); color: white; }
#game-title { margin-bottom: 70px; padding: 20px; font-size: 42px; font-weight: bold; text-align: center; text-shadow: 0 3px 10px black; }
GAME START ============================================================ */ #game-start-button { width: 260px; padding: 18px; border: 2px solid white; border-radius: 10px; background: rgba(0, 0, 0, 0.65); color: white; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s; }
#game-start-button:hover { background: white; color: black; transform: scale(1.05); }
テキストパネル ============================================================ */ #text-panel { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 20; min-height: 220px; padding: 18px; box-sizing: border-box; background: rgba(10, 10, 10, 0.92); border-radius: 12px; color: white; cursor: pointer; display: none; }
キャラクター名 ============================================================ */ #character-name { min-height: 30px; margin-bottom: 10px; font-size: 20px; font-weight: bold; }
本文 ============================================================ */ #novel-text { min-height: 100px; font-size: 18px; line-height: 1.8; white-space: pre-wrap; }
次へ ============================================================ */ #next-button { position: absolute; right: 15px; bottom: 12px; width: 50px; height: 40px; border: none; border-radius: 8px; background: transparent; color: white; font-size: 22px; cursor: pointer; display: none; }
#next-button:hover { background: rgba(255, 255, 255, 0.1); }
選択肢 ============================================================ */ #choice-area { width: 100%; }
.choice-button { display: block; width: 100%; margin: 10px 0; padding: 16px; box-sizing: border-box; border: none; border-radius: 8px; background: rgba(50, 50, 50, 0.95); color: white; font-size: 17px; cursor: pointer; transition: 0.15s; }
.choice-button:hover { background: rgba(90, 90, 90, 0.95); transform: translateY(-1px); }
END ============================================================ */ .end-title { margin-bottom: 15px; font-size: 28px; font-weight: bold; }
.end-return { margin-top: 25px; font-size: 14px; opacity: 0.65; }
body { min-height:100dvh; }
#novel-game { align-items:center; }
html,body { width:100%; min-height:100%; overflow-x:hidden; }
#novel-game { min-width:0; }
#game-screen { box-sizing:border-box; }
#novel-text { overflow-wrap:anywhere; word-break:normal; }
#text-panel { max-height:42%; overflow-y:auto; -webkit-overflow-scrolling:touch; }
#choice-area { padding-bottom:12px; }
.choice-button { touch-action:manipulation; }
@media (max-width:700px) { body { min-height:100dvh; align-items:center; padding:8px; padding-top:max(8px, env(safe-area-inset-top, 0px)); padding-bottom:max(8px, env(safe-area-inset-bottom, 0px)); }
#novel-game { width:100%; }
#game-screen { width:100%; height:calc(100dvh - max(8px, env(safe-area-inset-top, 0px)) - max(8px, env(safe-area-inset-bottom, 0px))); min-height:0; border-radius:10px; }
#background-image { height: min(65dvh, 550px); }
#game-title { font-size:clamp(24px,7vw,38px); margin-bottom:35px; }
#game-start-button { max-width:80%; }
#text-panel { left:8px; right:8px; bottom:max(8px, env(safe-area-inset-bottom)); padding:14px; min-height:0; max-height:45dvh; }
#character-name { font-size:clamp(15px,4vw,20px); }
#novel-text { font-size:clamp(14px,3.8vw,18px); line-height:1.65; min-height:0; padding-bottom:35px; }
.choice-button { font-size:16px; padding:12px; }
.end-title { font-size:24px; }
 }
</style>
<script>
(function () {
// データ
const SCENARIO =
    [{"type": "text", "character": "player", "background": "bg_home.png", "text": "腹減った。早く家に帰ってご飯食べよ。"}, {"type": "narration", "background": "bg_ramen.png", "text": "目の前にラーメン二郎の店があった。"}, {"type": "narration", "background": "ramen1.png", "text": "主人公は週に1、2回は食べるほどラーメンが好きだ。"}, {"type": "narration", "background": "ramen1.png", "text": "特に二郎系が好きで、濃厚なスープ、太くモチモチした麺、柔らかく美味しいチャーシュー、強烈なニンニクの香りと味を味わいたく来店することが多い。"}, {"type": "narration", "background": "ramen1.png", "text": "だが、最近はゲームやコンビニでも金を使っているため、余裕がなくなってきている。"}, {"type": "narration", "text": "そのため、最近は無駄な出費は抑え、ご飯も家で済ますようにしていた。"}, {"type": "narration", "background": "bg_ramen.png", "text": "悩んだ末に、主人公は..."}, {"type": "choice", "background": "bg_ramen.png", "choices": [{"text": "二郎に行く。", "next": 8}, {"text": "家で食べる。", "next": 19}]}, {"type": "text", "character": "player", "background": "bg_ramen.png", "text": "ああ、我慢できない!"}, {"type": "narration", "background": "ramen4.png", "text": "主人公は食券を店員に渡し席についた。"}, {"type": "narration", "background": "ramen4.png", "text": "...10分後"}, {"type": "text", "character": "sale", "background": "ramen4.png", "text": "ニンニク入れますか?"}, {"type": "text", "character": "player", "background": "ramen4.png", "text": "ニンニク、アブラ、カラメで。"}, {"type": "text", "character": "sale", "background": "ramen2.png", "text": "はいっ!お待たせしました!ニンニク、アブラ、カラメです。"}, {"type": "text", "character": "player", "background": "ramen2.png", "text": "いただきます!"}, {"type": "narration", "background": "ramen2.png", "text": "...10分後"}, {"type": "text", "character": "player", "background": "ramen3.png", "text": "ご馳走様でした。"}, {"type": "text", "character": "player", "background": "nightsky.png", "text": "満腹、満腹。美味しかった。"}, {"type": "end", "background": "Apple.png", "text": "帰りにリンゴジュースを買った。", "title": "満足END"}, {"type": "text", "character": "player", "background": "nightsky.png", "text": "家にまだご飯あるし、食べようと思えばいつでも食えるし、我慢しよう。"}, {"type": "end", "background": "end2.png", "text": "節約できた。", "title": "節約END"}];
const CHARACTERS =
    {"player": {"name": "主人公", "color": "#FFFFFF"}, "sale": {"name": "店員", "color": "#FF77AA"}, "boss": {"name": "魔王", "color": "#FF77AA"}, "mysterious": {"name": "???", "color": "#8888FF"}};
const BACKGROUND_DATA =
    {"bg_home.png": "bg_home.png", "bg_ramen.png": "bg_ramen.png", "ramen1.png": "ramen1.png", "ramen4.png": "ramen4.png", "ramen2.png": "ramen2.png", "ramen3.png": "ramen3.png", "nightsky.png": "nightsky.png", "Apple.png": "Apple.png", "end2.png": "end2.png"};
const BGM_DATA =
    "bgm.mp3";
const TYPE_SE_DATA =
    "type.mp3";
const CHOICE_SE_DATA =
    "choice.mp3";
// 画像は最初に先読みして切り替えを速くする
const preloadedImages = {};
const imageLoadPromise = Promise.all(Object.entries(BACKGROUND_DATA).map(([name,url]) => new Promise(resolve => {
    const img = new Image();
    preloadedImages[name] = img;
    img.onload = () => resolve(true);
    img.onerror = () => { console.warn("画像の読み込み失敗:", url); resolve(false); };
    img.src = url;
    if (img.complete) resolve(img.naturalWidth > 0);
})));
// スマホでも文字送り音が鳴るようWeb Audioを利用
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioContext = null;
let typeBuffer = null;
let lastTypeSound = 0;
if (AudioContextClass) {
    try { audioContext = new AudioContextClass(); } catch(e) { console.warn(e); }
}
const typeBufferPromise = audioContext ? fetch(TYPE_SE_DATA)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(data => audioContext.decodeAudioData(data))
    .then(buffer => { typeBuffer = buffer; })
    .catch(err => console.warn("文字送り音の読込失敗:",err)) : Promise.resolve();
function unlockAudio() {
    if (audioContext && audioContext.state !== "running") {
        audioContext.resume().catch(() => {});
    }
}
function playTypeSound() {
    if (audioContext && typeBuffer && audioContext.state === "running") {
        if (audioContext.currentTime - lastTypeSound < 0.055) return;
        const source = audioContext.createBufferSource();
        const gain = audioContext.createGain();
        source.buffer = typeBuffer;
        gain.gain.value = 0.25;
        source.connect(gain).connect(audioContext.destination);
        source.start();
        lastTypeSound = audioContext.currentTime;
    } else if (!audioContext && typeSE) {
        try { typeSE.currentTime=0; typeSE.play().catch(()=>{}); } catch(e) {}
    }
}
// 設定
const TYPE_SPEED = 40;
const START_DELAY = 300;
const CHOICE_DELAY = 500;
// 状態
let index = 0;
let currentText = "";
let currentPosition = 0;
let typing = false;
let waitingForNext = false;
let gameStarted = false;
let isEnding = false;
let processId = 0;
let typeTimer = null;
let startTimer = null;
let choiceTimer = null;
// UI
const root =
    document.getElementById(
        "novel-game"
    );
const titleScreen =
    root.querySelector(
        "#title-screen"
    );
const startButton =
    root.querySelector(
        "#game-start-button"
    );
const backgroundImage =
    root.querySelector(
        "#background-image"
    );
const textPanel =
    root.querySelector(
        "#text-panel"
    );
const characterName =
    root.querySelector(
        "#character-name"
    );
const novelText =
    root.querySelector(
        "#novel-text"
    );
const choiceArea =
    root.querySelector(
        "#choice-area"
    );
const nextButton =
    root.querySelector(
        "#next-button"
    );
// 音声
let bgm = null;
let typeSE = null;
let choiceSE = null;
if (BGM_DATA) {
    bgm =
        new Audio(
            BGM_DATA
        );
    bgm.loop = true;
    bgm.volume = 0.35;
}
if (TYPE_SE_DATA) {
    typeSE =
        new Audio(
            TYPE_SE_DATA
        );
    typeSE.volume = 0.25;
}
if (CHOICE_SE_DATA) {
    choiceSE =
        new Audio(
            CHOICE_SE_DATA
        );
    choiceSE.volume = 0.7;
}
// BGM開始
function startBGM() {
    if (!bgm) {
        return;
    }
    bgm.currentTime = 0;
    bgm.play().catch(
        function(error) {
            console.log(
                "BGM再生失敗:",
                error
            );
        }
    );
}
// BGM停止
function stopBGM() {
    if (!bgm) {
        return;
    }
    bgm.pause();
    bgm.currentTime = 0;
}
// 背景変更
function updateBackground(data) {
    // background指定なし
    // 前の背景を維持
    if (!("background" in data)) {
        return;
    }
    const filename =
        data.background;
    if (!filename) {
        backgroundImage.style.display =
            "none";
        backgroundImage.removeAttribute(
            "src"
        );
        return;
    }
    const imageData =
        BACKGROUND_DATA[
            filename
        ];
    if (!imageData) {
        console.log(
            "画像がありません:",
            filename
        );
        return;
    }
    backgroundImage.src =
        imageData;
    backgroundImage.style.display =
        "block";
}
// GAME START
async function startGame() {
    unlockAudio();
    startButton.disabled = true;
    startButton.textContent = "開始中...";
    // 画像・音声は裏で読み込み、ゲーム開始を妨げない
    void imageLoadPromise;
    void typeBufferPromise;
    startButton.disabled = false;
    startButton.textContent = "GAME START";
    clearTimeout(typeTimer);
    clearTimeout(startTimer);
    clearTimeout(choiceTimer);
    processId++;
    index = 0;
    currentText = "";
    currentPosition = 0;
    typing = false;
    waitingForNext = false;
    gameStarted = true;
    isEnding = false;
    characterName.textContent = "";
    novelText.textContent = "";
    choiceArea.innerHTML = "";
    nextButton.style.display =
        "none";
    // タイトルを消す
    titleScreen.style.display =
        "none";
    // テキストパネル表示
    textPanel.style.display =
        "block";
    // BGM開始
    startBGM();
    // シナリオ開始
    showCurrent();
}
// タイトルへ戻る
function returnToTitle() {
    clearTimeout(typeTimer);
    clearTimeout(startTimer);
    clearTimeout(choiceTimer);
    processId++;
    index = 0;
    currentText = "";
    currentPosition = 0;
    typing = false;
    waitingForNext = false;
    gameStarted = false;
    isEnding = false;
    // BGM停止
    stopBGM();
    // SE停止
    if (typeSE) {
        typeSE.pause();
        typeSE.currentTime = 0;
    }
    if (choiceSE) {
        choiceSE.pause();
        choiceSE.currentTime = 0;
    }
    // UI初期化
    characterName.textContent = "";
    novelText.textContent = "";
    choiceArea.innerHTML = "";
    nextButton.style.display =
        "none";
    textPanel.style.display =
        "none";
    // 背景を消す
    backgroundImage.style.display =
        "none";
    backgroundImage.removeAttribute(
        "src"
    );
    // タイトル表示
    titleScreen.style.display =
        "flex";
}
// 現在のシーン
function showCurrent() {
    processId++;
    const currentId =
        processId;
    clearTimeout(typeTimer);
    clearTimeout(startTimer);
    clearTimeout(choiceTimer);
    choiceArea.innerHTML = "";
    typing = false;
    waitingForNext = false;
    nextButton.style.display =
        "none";
    if (
        index < 0 ||
        index >= SCENARIO.length
    ) {
        returnToTitle();
        return;
    }
    const data =
        SCENARIO[index];
    // 背景
    updateBackground(data);
    // END
    if (data.type === "end") {
        isEnding = true;
        characterName.style.color =
            "#FFFFFF";
        characterName.innerHTML =
            '<div class="end-title">'
            +
            (data.title || "END")
            +
            '</div>';
        novelText.innerHTML =
            (data.text || "")
            +
            '<div class="end-return">'
            +
            'クリックでタイトルへ戻る'
            +
            '</div>';
        nextButton.style.display =
            "none";
        return;
    }
    // 選択肢
    if (data.type === "choice") {
        isEnding = false;
        characterName.textContent =
            "選択";
        characterName.style.color =
            "#FFFFFF";
        novelText.textContent =
            "";
        showChoices(data);
        return;
    }
    let text = "";
    // 通常文章
    if (data.type === "text") {
        const character =
            CHARACTERS[
                data.character
            ] || {};
        characterName.textContent =
            character.name || "";
        characterName.style.color =
            character.color ||
            "#FFFFFF";
        text =
            data.text || "";
    }
    // ナレーション
    else if (
        data.type === "narration"
    ) {
        characterName.textContent =
            "";
        characterName.style.color =
            "#FFFFFF";
        text =
            data.text || "";
    }
    // 不明なtype
    else {
        index++;
        showCurrent();
        return;
    }
    prepareText(
        text,
        currentId
    );
}
// 文章準備
function prepareText(
    text,
    currentId
) {
    currentText = text;
    currentPosition = 0;
    novelText.textContent = "";
    typing = false;
    waitingForNext = false;
    nextButton.style.display =
        "none";
    startTimer =
        setTimeout(
            function() {
                if (
                    currentId !==
                    processId
                ) {
                    return;
                }
                typing = true;
                typeNextCharacter(
                    currentId
                );
            },
            START_DELAY
        );
}
// 文字送り
function typeNextCharacter(
    currentId
) {
    if (
        currentId !==
        processId
    ) {
        return;
    }
    if (!typing) {
        return;
    }
    if (
        currentPosition >=
        currentText.length
    ) {
        finishTyping();
        return;
    }
    currentPosition++;
    novelText.textContent =
        currentText.substring(
            0,
            currentPosition
        );
    // type.mp3
    // 2文字ごと
    if (currentPosition % 2 === 0) playTypeSound();
    typeTimer =
        setTimeout(
            function() {
                typeNextCharacter(
                    currentId
                );
            },
            TYPE_SPEED
        );
}
// 文字送り終了
function finishTyping() {
    typing = false;
    currentPosition =
        currentText.length;
    novelText.textContent =
        currentText;
    waitingForNext = true;
    nextButton.style.display =
        "block";
}
// 全文表示
function showFullText() {
    clearTimeout(typeTimer);
    clearTimeout(startTimer);
    typing = false;
    currentPosition =
        currentText.length;
    novelText.textContent =
        currentText;
    waitingForNext = true;
    nextButton.style.display =
        "block";
}
// 次のシーン
function nextScene() {
    if (!gameStarted) {
        return;
    }
    typing = false;
    waitingForNext = false;
    index++;
    showCurrent();
}
// 選択肢
function showChoices(data) {
    choiceArea.innerHTML = "";
    const choices =
        data.choices || [];
    choices.forEach(
        function(choice) {
            const button =
                document.createElement(
                    "button"
                );
            button.className =
                "choice-button";
            button.textContent =
                choice.text || "";
            button.addEventListener(
                "click",
                function(event) {
                    event.stopPropagation();
                    // choice.mp3
                    if (choiceSE) {
                        try {
                            choiceSE.pause();
                            choiceSE.currentTime = 0;
                            choiceSE.play().catch(
                                function() {}
                            );
                        }
                        catch(error) {
                        }
                    }
                    choiceArea.innerHTML =
                        "";
                    // 分岐
                    if (
                        choice.next !==
                        undefined &&
                        choice.next !==
                        null
                    ) {
                        index =
                            choice.next;
                    }
                    else {
                        index++;
                    }
                    processId++;
                    const choiceId =
                        processId;
                    choiceTimer =
                        setTimeout(
                            function() {
                                if (
                                    choiceId !==
                                    processId
                                ) {
                                    return;
                                }
                                showCurrent();
                            },
                            CHOICE_DELAY
                        );
                }
            );
            choiceArea.appendChild(
                button
            );
        }
    );
}
// GAME START
startButton.addEventListener(
    "click",
    function(event) {
        event.preventDefault();
        event.stopPropagation();
        startGame();
    }
);
// ▼
nextButton.addEventListener(
    "click",
    function(event) {
        event.preventDefault();
        event.stopPropagation();
        if (isEnding) {
            returnToTitle();
            return;
        }
        if (typing) {
            showFullText();
            return;
        }
        if (waitingForNext) {
            nextScene();
        }
    }
);
// テキストパネル
textPanel.addEventListener(
    "click",
    function(event) {
        // END → タイトル
        if (isEnding) {
            returnToTitle();
            return;
        }
        if (!gameStarted) {
            return;
        }
        // 選択肢
        if (
            event.target.classList &&
            event.target.classList.contains(
                "choice-button"
            )
        ) {
            return;
        }
        // ▼
        if (
            event.target ===
            nextButton
        ) {
            return;
        }
        // 文字送り中
        if (typing) {
            showFullText();
            return;
        }
        // 次へ
        if (waitingForNext) {
            nextScene();
        }
    }
);
// 初期画面
titleScreen.style.display =
    "flex";
textPanel.style.display =
    "none";
backgroundImage.style.display =
    "none";
})();
</script>
</body></html>
