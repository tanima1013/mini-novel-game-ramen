
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ラーメンを食べるか否か</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Yu Gothic", sans-serif;
}
#game-screen {
  position: relative;
  width: 700px;
  max-width: 100%;
  height: 800px;
  background: #222;
  overflow: hidden;
  border-radius: 12px;
}
#background-image {
  position: absolute;
  top: 0;
  width: 100%;
  height: 550px;
  object-fit: contain;
  display: none;
}
#title-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(#2229, #000e);
  color: white;
}
#game-title {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 20px 15px 65px;
}
#game-start-button {
  padding: 18px 35px;
  background: #111;
  border: 2px solid white;
  border-radius: 10px;
  color: white;
  font-size: 22px;
  cursor: pointer;
}
#text-panel {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 5;
  min-height: 220px;
  max-height: 45%;
  padding: 18px;
  background: rgba(10,10,10,.94);
  border-radius: 12px;
  color: white;
  overflow-y: auto;
  display: none;
  cursor: pointer;
}
#character-name {
  min-height: 30px;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}
#novel-text {
  font-size: 18px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding-bottom: 45px;
}
#next-button {
  position: sticky;
  float: right;
  bottom: 0;
  border: none;
  background: #333;
  color: white;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
  display: none;
}
.choice-button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #444;
  color: white;
  font-size: 17px;
  cursor: pointer;
  touch-action: manipulation;
}
.end-title { font-size: 28px; font-weight: bold; }
.end-return { margin-top: 20px; font-size: 14px; opacity: .7; }

@media (max-width: 700px) {
  body { align-items: stretch; }
  #game-screen {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
  }
  #background-image {
    height: min(65dvh, 550px);
  }
  #game-title { font-size: clamp(24px, 7vw, 38px); }
  #text-panel {
    left: 8px;
    right: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    padding: 14px;
    min-height: 0;
    max-height: 45dvh;
  }
  #character-name { font-size: 17px; }
  #novel-text { font-size: 16px; line-height: 1.65; }
  .choice-button { font-size: 16px; padding: 12px; }
}
</style>
</head>
<body>

<div id="game-screen">
  <img id="background-image" alt="">

  <div id="title-screen">
    <div id="game-title">ラーメンを食べるか否か</div>
    <button id="game-start-button">GAME START</button>
  </div>

  <div id="text-panel">
    <div id="character-name"></div>
    <div id="novel-text"></div>
    <div id="choice-area"></div>
    <button id="next-button">▼</button>
  </div>
</div>

<script>
"use strict";

const CHARACTERS = {
  player: { name: "主人公", color: "#FFFFFF" },
  sale: { name: "店員", color: "#FF77AA" },
  boss: { name: "魔王", color: "#FF77AA" },
  mysterious: { name: "???", color: "#8888FF" }
};

const SCENARIO = [
  {type:"text",character:"player",background:"bg_home.png",
   text:"腹減った。早く家に帰ってご飯食べよ。"},
  {type:"narration",background:"bg_ramen.png",
   text:"目の前にラーメン二郎の店があった。"},
  {type:"narration",background:"ramen1.png",
   text:"主人公は週に1、2回は食べるほどラーメンが好きだ。"},
  {type:"narration",background:"ramen1.png",
   text:"特に二郎系が好きで、濃厚なスープ、太くモチモチした麺、柔らかく美味しいチャーシュー、強烈なニンニクの香りと味を味わいたく来店することが多い。"},
  {type:"narration",background:"ramen1.png",
   text:"だが、最近はゲームやコンビニでも金を使っているため、余裕がなくなってきている。"},
  {type:"narration",
   text:"そのため、最近は無駄な出費は抑え、ご飯も家で済ますようにしていた。"},
  {type:"narration",background:"bg_ramen.png",
   text:"悩んだ末に、主人公は..."},
  {type:"choice",background:"bg_ramen.png",choices:[
    {text:"二郎に行く。",next:8},
    {text:"家で食べる。",next:19}
  ]},
  {type:"text",character:"player",background:"bg_ramen.png",
   text:"ああ、我慢できない!"},
  {type:"narration",background:"ramen4.png",
   text:"主人公は食券を店員に渡し席についた。"},
  {type:"narration",background:"ramen4.png",text:"...10分後"},
  {type:"text",character:"sale",background:"ramen4.png",
   text:"ニンニク入れますか?"},
  {type:"text",character:"player",background:"ramen4.png",
   text:"ニンニク、アブラ、カラメで。"},
  {type:"text",character:"sale",background:"ramen2.png",
   text:"はいっ!お待たせしました!ニンニク、アブラ、カラメです。"},
  {type:"text",character:"player",background:"ramen2.png",
   text:"いただきます!"},
  {type:"narration",background:"ramen2.png",text:"...10分後"},
  {type:"text",character:"player",background:"ramen3.png",
   text:"ご馳走様でした。"},
  {type:"text",character:"player",background:"nightsky.png",
   text:"満腹、満腹。美味しかった。"},
  {type:"end",background:"Apple.png",title:"満足END",
   text:"帰りにリンゴジュースを買った。"},
  {type:"text",character:"player",background:"nightsky.png",
   text:"家にまだご飯あるし、食べようと思えばいつでも食えるし、我慢しよう。"},
  {type:"end",background:"end2.png",title:"節約END",
   text:"節約できた。"}
];

const TYPE_SPEED = 40;
const START_DELAY = 300;
const CHOICE_DELAY = 500;

const $ = id => document.getElementById(id);
const bg = $("background-image");
const title = $("title-screen");
const startButton = $("game-start-button");
const panel = $("text-panel");
const nameBox = $("character-name");
const textBox = $("novel-text");
const choiceArea = $("choice-area");
const nextButton = $("next-button");

// 画像の先読み
const imageNames = [...new Set(
  SCENARIO.map(s => s.background).filter(Boolean)
)];
const imageCache = new Map();

const imageReady = Promise.all(imageNames.map(filename => {
  return new Promise(resolve => {
    const img = new Image();
    imageCache.set(filename, img);
    img.onload = () => resolve();
    img.onerror = () => {
      console.warn("画像が見つかりません:", filename);
      resolve();
    };
    img.src = filename;
  });
}));

// 音声
const bgm = new Audio("bgm.mp3");
bgm.loop = true;
bgm.volume = 0.35;

const choiceSE = new Audio("choice.mp3");
choiceSE.volume = 0.7;

let audioContext = null;
let typeBuffer = null;

async function initAudio() {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (!audioContext) {
    audioContext = new AudioContextClass();
  }
  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }
  if (!typeBuffer) {
    try {
      const response = await fetch("type.mp3");
      if (!response.ok) throw new Error("type.mp3");
      const data = await response.arrayBuffer();
      typeBuffer = await audioContext.decodeAudioData(data);
    } catch (error) {
      console.warn("文字送り音を読み込めません:", error);
    }
  }
}

function playTypeSound() {
  if (!audioContext || !typeBuffer ||
      audioContext.state !== "running") return;
  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  source.buffer = typeBuffer;
  gain.gain.value = 0.25;
  source.connect(gain);
  gain.connect(audioContext.destination);
  source.start();
}

function playChoiceSound() {
  choiceSE.currentTime = 0;
  choiceSE.play().catch(() => {});
}

function startBGM() {
  bgm.currentTime = 0;
  bgm.play().catch(() => {});
}

function stopBGM() {
  bgm.pause();
  bgm.currentTime = 0;
}

let index = 0;
let currentText = "";
let position = 0;
let typing = false;
let waiting = false;
let ending = false;
let playing = false;
let timer = null;
let sceneToken = 0;

function clearTimer() {
  clearTimeout(timer);
  timer = null;
}

function setBackground(scene) {
  if (!Object.hasOwn(scene, "background")) return;
  if (!scene.background) {
    bg.style.display = "none";
    bg.removeAttribute("src");
    return;
  }
  bg.src = scene.background;
  bg.style.display = "block";
}

async function startGame() {
  if (playing) return;
  playing = true;
  startButton.disabled = true;
  startButton.textContent = "読み込み中...";

  // タップ操作で音声を有効化
  const audioPromise = initAudio();
  startBGM();

  await imageReady;
  await audioPromise;

  index = 0;
  ending = false;
  title.style.display = "none";
  panel.style.display = "block";
  startButton.disabled = false;
  startButton.textContent = "GAME START";
  showScene();
}

function returnToTitle() {
  sceneToken++;
  clearTimer();
  stopBGM();
  choiceSE.pause();
  playing = false;
  ending = false;
  typing = false;
  waiting = false;
  index = 0;
  nameBox.textContent = "";
  textBox.textContent = "";
  choiceArea.replaceChildren();
  nextButton.style.display = "none";
  panel.style.display = "none";
  bg.style.display = "none";
  bg.removeAttribute("src");
  title.style.display = "flex";
}

function showScene() {
  sceneToken++;
  clearTimer();
  typing = false;
  waiting = false;
  choiceArea.replaceChildren();
  nextButton.style.display = "none";
  panel.scrollTop = 0;

  if (index < 0 || index >= SCENARIO.length) {
    returnToTitle();
    return;
  }

  const scene = SCENARIO[index];
  setBackground(scene);

  if (scene.type === "end") {
    ending = true;
    nameBox.textContent = scene.title || "END";
    nameBox.style.color = "#FFFFFF";
    textBox.textContent =
      (scene.text || "") + "\n\nタップ・クリックでタイトルへ戻る";
    return;
  }

  ending = false;

  if (scene.type === "choice") {
    nameBox.textContent = "選択";
    nameBox.style.color = "#FFFFFF";
    textBox.textContent = "";
    showChoices(scene);
    return;
  }

  if (scene.type === "text") {
    const character = CHARACTERS[scene.character] || {};
    nameBox.textContent = character.name || "";
    nameBox.style.color = character.color || "#FFFFFF";
  } else {
    nameBox.textContent = "";
    nameBox.style.color = "#FFFFFF";
  }

  prepareText(scene.text || "");
}

function prepareText(text) {
  currentText = text;
  position = 0;
  typing = false;
  waiting = false;
  textBox.textContent = "";
  const token = sceneToken;

  timer = setTimeout(() => {
    if (token !== sceneToken) return;
    typing = true;
    typeNext(token);
  }, START_DELAY);
}

function typeNext(token) {
  if (token !== sceneToken || !typing) return;

  if (position >= currentText.length) {
    finishTyping();
    return;
  }

  position++;
  textBox.textContent = currentText.slice(0, position);

  if (position % 2 === 0) playTypeSound();

  timer = setTimeout(() => typeNext(token), TYPE_SPEED);
}

function finishTyping() {
  clearTimer();
  typing = false;
  position = currentText.length;
  textBox.textContent = currentText;
  waiting = true;
  nextButton.style.display = "block";
}

function nextScene() {
  if (!playing || ending) return;
  index++;
  showScene();
}

function showChoices(scene) {
  scene.choices.forEach(choice => {
    const button = document.createElement("button");
    button.className = "choice-button";
    button.textContent = choice.text;
    button.addEventListener("click", event => {
      event.stopPropagation();
      playChoiceSound();
      choiceArea.replaceChildren();
      index = choice.next ?? index + 1;
      sceneToken++;
      const token = sceneToken;
      timer = setTimeout(() => {
        if (token === sceneToken) showScene();
      }, CHOICE_DELAY);
    });
    choiceArea.appendChild(button);
  });
}

function advance() {
  if (!playing) return;
  if (ending) {
    returnToTitle();
  } else if (choiceArea.children.length > 0) {
    return;
  } else if (typing || (!waiting && timer !== null)) {
    finishTyping();
  } else if (waiting) {
    nextScene();
  }
}

startButton.addEventListener("click", startGame);

panel.addEventListener("click", event => {
  if (event.target.closest(".choice-button")) return;
  advance();
});

nextButton.addEventListener("click", event => {
  event.stopPropagation();
  advance();
});
</script>
</body>
</html>
